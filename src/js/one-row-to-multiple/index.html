<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Перестроение солдатиков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <label>
            Точек в ряду:
            <input type="number" id="count" min="2" max="100" value="10">
        </label>
        <label>
            Рядов:
            <select id="rows">
                <option value="2" selected>2</option>
            </select>
        </label>
        <button id="build">Перестроить</button>
    </div>
    <canvas id="stage"></canvas>
    <script src="script.js"></script>
</body>
</html>
